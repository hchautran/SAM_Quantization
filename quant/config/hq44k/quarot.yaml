model:
  model_type: vit_l
  checkpoint: ./pretrained_checkpoint/sam_vit_l_0b3195.pth
  seed: 42
  output: ./output/hq44k/base_l
  restore_model:  ./pretrained_checkpoint/epoch_11.pth 
  device: cuda

plot_distribution: True

quantization:
  quandecoder: False
  quanrtn: False
  quangptq: True
  quansmooth: False
  quanro: True
  rtn_cuda: False
  gptq_cuda: False
  act_scales_file: ./pretrained_checkpoint/sam_vit_lactivation_scales.pt
  act_quant: per_token
  weight_quant: per_channel
  n_bits: 8
  quantize_output: False
  low_high_density: none
    

quarot_inf:
  hidden_size_image_en: 1024
  num_attention_head_image_en: 64
  hidden_size_mask_de: 256
  num_attention_head_mask_de: 32
  fp32_had: False #Apply Hadamard rotation in FP32 (default: False)
  device: cuda:0
  seed: 42
  rotate_mode: hadamard
rtn_ro_config:
  n_bits: 4
  act_quant: per_token
  weight_quant: per_channel
  group_size: 64
  quantize_output: False
  quantize_input: True
gptq:
  blocksize: 128
  device: cuda
  nsamples: 128
  w_bits: 4
  ac_bits: 4
  act_quant: per_token
  quantize_output: True
  quantize_input: True
  group_size: 64
  w_asym: False
  w_clip: False
  w_groupsize: -1
  percdamp: 0.01
  act_order: False